\* expect: violated
\* module: EngineMutants
\* A draining socket stays open while the lookup whose query left it waits on a stream, which only a
\* truncated answer reaches (docs/mutations.md OA34).
CONSTANTS
    Servers = 2
    Slots = 1
    Conns = 1
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = FALSE
    PerPort = 2
    Tls = FALSE
    Request = FALSE
    Channel = FALSE
    OpsMax = 4
    FailuresMax = 1
    SentMax = 3
    Truncates <- Truncating
    CloseIfDrained <- CloseIfDrainedWaiting
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
