\* The engine's walks for the replay over UDP, one slot and one connection, with answers that may
\* come truncated: TC set, or the datagram cut by its buffer (docs/design.md §19 step 13, the
\* datagram's rule 6). TLC's simulation mode, which `zig build spec` runs; `zig build tla` does not
\* read this directory. Added on 2026-10-14, and named to come last, so that no pick moves.
CONSTANTS
    Servers = 2
    Slots = 1
    Conns = 1
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = FALSE
    PerPort = 2
    Tls = FALSE
    Request = FALSE
    Channel = FALSE
    OpsMax = 0
    FailuresMax = 0
    SentMax = 0
    Truncates <- Truncating
INIT TraceInit
NEXT TraceNext
INVARIANT Clean
CHECK_DEADLOCK FALSE
